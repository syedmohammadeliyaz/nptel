<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NPTEL Library</title>
<style>
:root{--bg:#0f1114;--s1:#171a1f;--s2:#20242b;--line:#2a2f38;--tx:#eceef2;--mut:#98a1b0;--acc:#7cb0ff;--accbg:#16233a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

.bar{display:flex;align-items:center;gap:4px;padding:8px 12px 8px 6px;flex:none}
.ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none;transition:background .15s,transform .1s}
.ico:active{background:var(--s2);transform:scale(.92)}
.bar-t{min-width:0;flex:1;padding-left:2px}
.t1{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t2{font-size:12.5px;color:var(--mut)}

.hero{padding:22px 18px 4px;flex:none}
.hero h1{margin:0;font-size:28px;letter-spacing:-.5px}
.hero p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.searchwrap{padding:10px 14px 8px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;height:44px;color:var(--mut);transition:border-color .15s}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);height:100%}
.search input::placeholder{color:var(--mut)}
.search .ico{width:32px;height:32px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px 18px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:116px;transition:transform .12s,background .15s}
.tile:active{transform:scale(.97);background:var(--s2)}
.badge{align-self:flex-start;min-width:42px;padding:0 9px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.3px;background:hsl(var(--h) 38% 21%);color:hsl(var(--h) 85% 80%)}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .ct{font-size:12px;color:var(--mut);margin-top:2px}

.letter{position:sticky;top:0;background:var(--bg);color:var(--acc);font-weight:700;font-size:12.5px;padding:10px 18px 4px;z-index:1;letter-spacing:.6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px 11px 16px;border-bottom:1px solid var(--line);transition:background .12s}
.row:active{background:var(--s1)}
.row .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:hsl(var(--h) 38% 21%);color:hsl(var(--h) 85% 80%)}
.row .ic svg{width:16px;height:16px}
.row .rt{flex:1;min-width:0}
.row .rn{display:block;font-size:14.5px;line-height:1.3;font-weight:500}
.row .rs{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.row>svg{color:var(--mut);width:18px;height:18px}
.count-note{padding:6px 18px;color:var(--mut);font-size:12.5px}

.player{position:relative;width:100%;aspect-ratio:16/9;max-height:56vh;background:#000;flex:none}
#ytHost,#ytHost iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.pmsg{position:absolute;inset:0;background:rgba(10,12,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:10px;z-index:2;font-size:13.5px;color:var(--mut)}
.pmsg p{margin:0}
.now{display:flex;align-items:center;gap:2px;padding:8px 4px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.now .nt{flex:1;min-width:0}
.sv{color:var(--mut)}
.sv.is{color:var(--acc)}
.sv.is svg{fill:currentColor}

.cinfo{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--acc);color:#0b1220;font-weight:600;border-radius:999px;padding:9px 16px;display:inline-flex;gap:6px;align-items:center;font-size:14px;transition:transform .1s}
.btn:active{transform:scale(.95)}
.btn svg{width:14px;height:14px}
.btn.ghost{background:var(--s2);color:var(--tx)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

.lec{display:flex;align-items:flex-start;gap:12px;padding:9px 4px 9px 14px;cursor:pointer;border-left:3px solid transparent;content-visibility:auto;contain-intrinsic-size:auto 86px;transition:background .12s}
.lec:active{background:var(--s1)}
.lec.cur{background:var(--accbg);border-left-color:var(--acc)}
.lec .th{position:relative;width:126px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--s2);flex:none}
.lec .th img{width:100%;height:100%;object-fit:cover;display:block}
.lec .du{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;font-size:11px;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.lec .lm{flex:1;min-width:0;padding-top:1px}
.lec .lt{font-size:14px;line-height:1.3;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lec .ls{font-size:12px;color:var(--mut);margin-top:3px}
.lec.cur .ls{color:var(--acc)}

.grp{padding-bottom:6px}
.gh{display:flex;justify-content:space-between;gap:10px;padding:14px 16px 6px;font-weight:600;font-size:13.5px;color:var(--acc)}

.sk{display:flex;gap:12px;padding:9px 14px}
.sk .a,.sk .b{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.3s linear infinite}
.sk .a{width:126px;aspect-ratio:16/9;border-radius:8px;flex:none}
.sk .b{flex:1;height:14px;border-radius:6px;margin-top:6px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.foot{padding:18px 16px 26px;text-align:center;color:var(--mut);font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;vertical-align:-2px;margin-right:6px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{padding:48px 24px;text-align:center;color:var(--mut);font-size:13.5px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}

#tabs{display:flex;flex:none;background:var(--s1);border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;color:var(--mut)}
#tabs button.active{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,10px);background:#e8eaf0;color:#101318;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  <section id="v-subject" class="view hidden">

    <div class="searchwrap" style="padding-top:2px"><div class="search">

    </div></div>
    <div class="scroll" id="subScroll"><div id="subBody"></div></div>
  </section>

  <section id="v-course" class="view hidden">
    <header class="bar">
      <button class="ico" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

    <div id="playerBox" class="player hidden"><div id="ytHost"></div><div id="playerMsg" class="pmsg hidden"></div></div>
    <div id="nowBar" class="now hidden">

      <button id="nowSave" class="ico sv" aria-label="Save lecture"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
      <button id="nowExt" class="ico" aria-label="Open in YouTube"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    </div>
    <div class="scroll" id="crScroll"><div id="crBody"></div><div id="crFoot"></div></div>
  </section>

  <section id="v-saved" class="view hidden">
    <header class="hero"><h1>Saved</h1><p id="savedSub"></p></header>
    <div class="scroll" id="savedScroll"><div id="savedBody"></div></div>
  </section>

  <nav id="tabs">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>Browse</button>
    <button data-tab="saved"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Saved</button>
  </nav>
</div>

/* ---------- native bridge: live lecture lists ---------- */
var CLIENT_VERSION='2.20250925.01.00';
var CTX={client:{clientName:'WEB',clientVersion:CLIENT_VERSION,hl:'en',gl:'IN'}};
var seq=0, pending=Object.create(null);
function browse(payload){
  return new Promise(function(resolve,reject){
    if(!window.Native||!window.Native.browse){ reject(new Error('Lecture lists load inside the Android app.')); return; }
    var id='r'+(++seq)+'x'+Date.now().toString(36);
    var timer=setTimeout(function(){ delete pending[id]; reject(new Error('Timed out. Check your connection.')); },30000);
    pending[id]={resolve:resolve,reject:reject,timer:timer};
    try{ window.Native.browse(id, JSON.stringify(Object.assign({context:CTX},payload))); }
    catch(e){ clearTimeout(timer); delete pending[id]; reject(e); }
  });
}
window.__nativeDone=function(id){
  var p=pending[id]; if(!p) return;
  delete pending[id]; clearTimeout(p.timer);
  var t=''; try{ t=window.Native.take(id); }catch(e){}
  try{
    var j=JSON.parse(t);
    if(j&&j.__error) p.reject(new Error(j.__error)); else p.resolve(j);
  }catch(e){ p.reject(new Error('Unexpected response from YouTube.')); }
};
function txt(o){
  if(!o) return '';
  if(typeof o==='string') return o;
  if(o.simpleText) return o.simpleText;
  if(Array.isArray(o.runs)) return o.runs.map(function(r){ return r.text; }).join('');
  return o.content||'';
}
function findToken(o,depth){
  if(!o||typeof o!=='object'||depth>6) return null;
  if(o.continuationCommand&&o.continuationCommand.token) return o.continuationCommand.token;
  for(var k in o){ var r=findToken(o[k],depth+1); if(r) return r; }
  return null;
}
function parseBrowse(root){
  var videos=[], token=null, total=null, stack=[root];
  while(stack.length){
    var n=stack.pop();
    if(!n||typeof n!=='object') continue;
    if(Array.isArray(n)){ for(var i=n.length-1;i>=0;i--) stack.push(n[i]); continue; }
    if(n.playlistVideoRenderer){
      var r=n.playlistVideoRenderer, title=txt(r.title);
      if(r.videoId && r.isPlayable!==false && !/^\[(private|deleted) video\]$/i.test(title))
        videos.push({id:r.videoId,t:title||'Untitled',d:txt(r.lengthText)});
      continue;
    }
    if(n.continuationItemRenderer){ var t=findToken(n.continuationItemRenderer,0); if(t) token=t; continue; }
    if(n.lockupViewModel && /VIDEO/.test(n.lockupViewModel.contentType||'') && n.lockupViewModel.contentId){
      var l=n.lockupViewModel, md=l.metadata&&l.metadata.lockupMetadataViewModel;
      videos.push({id:l.contentId,t:(md&&txt(md.title))||'Untitled',d:''});
      continue;
    }
    if(n.playlistHeaderRenderer && total==null){
      var m=/([\d,]+)/.exec(txt(n.playlistHeaderRenderer.numVideosText));
      if(m) total=parseInt(m[1].replace(/,/g,''),10);
    }
    for(var k in n){ if(n[k]&&typeof n[k]==='object') stack.push(n[k]); }
  }
  return {videos:videos, token:token, total:total};
}

/* ---------- navigation ---------- */
var SCROLLERS={home:'#homeScroll',subject:'#subScroll',course:'#crScroll',saved:'#savedScroll'};
var screen='home', stack=[], cs=null, yt=null, ytP=null;
function topEntry(){ return stack[stack.length-1]; }
function leave(){
  var t=topEntry(); if(!t) return;
  var sc=$(SCROLLERS[t.name]); if(sc) t.scroll=sc.scrollTop;
  if(t.name==='course') closeCourse();
}
function navigate(name,args){ leave(); stack.push({name:name,args:args||{},scroll:0}); renderTop(false); }
function resetTo(name){ leave(); stack.length=0; stack.push({name:name,args:{},scroll:0}); renderTop(false); }
function back(){
  if(stack.length>1){ leave(); stack.pop(); renderTop(true); return true; }
  if(topEntry().name!=='home'){ resetTo('home'); return true; }
  return false;
}
window.__back=back;
function renderTop(restore){
  var t=topEntry(); screen=t.name;
  $$('.view').forEach(function(v){ v.classList.toggle('hidden', v.id!=='v-'+t.name); });
  $('#tabs').classList.toggle('hidden', t.name==='course');
  $$('#tabs button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===(t.name==='saved'?'saved':'home')); });
  if(t.name==='home') renderHome();
  else if(t.name==='subject') openSubject(t.args);
  else if(t.name==='saved') renderSaved();
  else if(t.name==='course') openCourse(t.args);
  var sc=$(SCROLLERS[t.name]); if(sc) sc.scrollTop = restore ? (t.scroll||0) : 0;
}

    '<span class="rt"><span class="rn">'+esc(c.t)+'</span>'+(withSubject?'<span class="rs">'+esc(c.d)+'</span>':'')+'</span>'+ic('chev')+'</button>';

function renderHome(){
  var input=$('#homeSearch'), q=input.value.trim();
  $('#homeClear').classList.toggle('hidden',!q);
  var body=$('#homeBody');
  if(!q){
    body.innerHTML='<div class="grid">'+subjects.map(function(s,i){
      return '<button class="tile" data-sub="'+i+'"><span class="badge" style="--h:'+s.hue+'">'+esc(s.code)+'</span><span><div class="nm">'+esc(s.name)+'</div><div class="ct">'+s.list.length+(s.list.length===1?' course':' courses')+'</div></span></button>';
    }).join('')+'</div>';
    return;
  }
  var toks=tokens(q);
  var res=COURSES.filter(function(c){ return match(c.t+' '+c.d,toks); });
  if(!res.length){ body.innerHTML='<div class="empty"><b>No courses found</b>Try a different word.</div>'; return; }
  var shown=res.slice(0,150);
  body.innerHTML='<div class="count-note">'+res.length+(res.length===1?' result':' results')+(res.length>shown.length?' (showing first 150)':'')+'</div>'+
    shown.map(function(c){ return courseRow(c,true); }).join('');
}

$('#homeBody').addEventListener('click',function(e){
  var t=e.target.closest('[data-sub]');
  if(t){ navigate('subject',{name:subjects[+t.getAttribute('data-sub')].name,q:''}); return; }
  var r=e.target.closest('[data-course]');
  if(r) navigate('course',{pl:r.getAttribute('data-course')});
});

/* ---------- subject ---------- */
function openSubject(a){
  var s=subjByName[a.name]; if(!s) return;
  $('#subTitle').textContent=s.name;
  $('#subCount').textContent=s.list.length+(s.list.length===1?' course':' courses');
  $('#subSearch').value=a.q||'';
  renderSubjectList();
}
function renderSubjectList(){
  var t=topEntry(), s=subjByName[t.args.name], body=$('#subBody');
  var toks=tokens(t.args.q||'');
  var list=s.list.filter(function(c){ return match(c.t,toks); });
  if(!list.length){ body.innerHTML='<div class="empty"><b>No matches</b>Try a different word.</div>'; return; }
  var html='', last='';
  list.forEach(function(c){
    var ch=c.t.charAt(0), L=/[a-z]/i.test(ch)?ch.toUpperCase():'#';
    if(L!==last){ html+='<div class="letter">'+L+'</div>'; last=L; }
    html+=courseRow(c,false);
  });
  body.innerHTML=html;
}
$('#subSearch').addEventListener('input',function(){
  topEntry().args.q=this.value; renderSubjectList(); $('#subScroll').scrollTop=0;
});
$('#subBody').addEventListener('click',function(e){
  var r=e.target.closest('[data-course]'); if(r) navigate('course',{pl:r.getAttribute('data-course')});
});

/* ---------- saved ---------- */
function renderSaved(){
  var b=$('#savedBody');
  $('#savedSub').textContent=saved.length+(saved.length===1?' lecture':' lectures')+' bookmarked';
  if(!saved.length){ b.innerHTML='<div class="empty"><b>Nothing saved yet</b>Tap the bookmark on any lecture and it will appear here.</div>'; return; }
  var groups=[], idx=Object.create(null);
  saved.forEach(function(v){
    if(!(v.pl in idx)){ idx[v.pl]=groups.length; groups.push({pl:v.pl,items:[]}); }
    groups[idx[v.pl]].items.push(v);
  });
  b.innerHTML=groups.map(function(g){
    var c=byId[g.pl];
    return '<div class="grp"><div class="gh"><span>'+esc(c?c.t:'Course')+'</span><span class="t2">'+g.items.length+'</span></div>'+
      g.items.map(function(v){
        return '<div class="lec" data-pl="'+esc(v.pl)+'" data-vid="'+esc(v.id)+'"><div class="th"><img loading="lazy" decoding="async" alt="" src="https://i.ytimg.com/vi/'+esc(v.id)+'/mqdefault.jpg"></div>'+
          '<div class="lm"><div class="lt">'+esc(v.t)+'</div></div>'+
          '<button class="ico sv is" data-save="'+esc(v.id)+'" aria-label="Remove from Saved">'+ic('bm')+'</button></div>';
      }).join('')+'</div>';
  }).join('');
}
$('#savedBody').addEventListener('click',function(e){
  var sv=e.target.closest('[data-save]');
  if(sv){ toggleSave({id:sv.getAttribute('data-save')}); return; }
  var row=e.target.closest('.lec');
  if(row){
    var id=row.getAttribute('data-vid'), item=saved.find(function(s){ return s.id===id; });
    navigate('course',{pl:row.getAttribute('data-pl'),play:id,title:item?item.t:''});
  }
});

/* ---------- course + lectures (loaded in pages as you scroll) ---------- */
function titleOf(id){ return (cs&&cs.meta[id]&&cs.meta[id].t)||''; }
function playlistUrl(){ return 'https://www.youtube.com/playlist?list='+cs.pl; }
function videoUrl(){ return cs.current?('https://www.youtube.com/watch?v='+cs.current+'&list='+cs.pl):playlistUrl(); }
function openExternal(u){
  try{ if(window.Native&&window.Native.openExternal){ window.Native.openExternal(u); return; } }catch(e){}
  window.open(u,'_blank');
}
function skeleton(n){ var h=''; for(var i=0;i<n;i++) h+='<div class="sk"><div class="a"></div><div class="b"></div></div>'; return h; }

function openCourse(a){
  var c=byId[a.pl]; if(!c) return;
  cs={pl:c.p,c:c,videos:[],seen:Object.create(null),meta:Object.create(null),token:null,total:null,
      loading:false,done:false,error:null,current:null,dead:false,inflight:null,playlistMode:false};
  $('#crTitle').textContent=c.t; $('#crSub').textContent=c.d;
  $('#crBody').innerHTML='<div class="cinfo"><span class="t2" id="crCount">Loading lectures…</span><button class="btn hidden" id="startBtn">'+ic('play','fill')+'Play</button></div><div id="lecList"></div>';
  $('#crFoot').innerHTML='';
  $('#playerBox').classList.add('hidden'); $('#nowBar').classList.add('hidden'); hideMsg();
  if(a.play){ cs.meta[a.play]={t:a.title||''}; playVideo(a.play); }
  loadMore();
}
function closeCourse(){
  if(!cs) return;
  cs.dead=true; destroyPlayer(); cs=null;
}
function updateCount(){
  var s=cs; if(!s) return;
  var n=s.videos.length, t;
  if(s.done) t=n+(n===1?' lecture':' lectures');
  else if(s.total && s.total>n) t=n+' of '+s.total+' lectures';
  else t=n+'+ lectures';
  var el=$('#crCount'); if(el) el.textContent=t;
  var b=$('#startBtn'); if(b) b.classList.toggle('hidden', n===0 || !!s.current || s.playlistMode);
}
function rowHtml(v,n){
  return '<div class="lec" data-vid="'+esc(v.id)+'"><div class="th"><img loading="lazy" decoding="async" alt="" src="https://i.ytimg.com/vi/'+esc(v.id)+'/mqdefault.jpg">'+(v.d?'<span class="du">'+esc(v.d)+'</span>':'')+'</div>'+
    '<div class="lm"><div class="lt">'+esc(v.t)+'</div><div class="ls">Lecture '+n+'</div></div>'+
    '<button class="ico sv'+(isSaved(v.id)?' is':'')+'" data-save="'+esc(v.id)+'" aria-label="Save lecture">'+ic('bm')+'</button></div>';
}
function highlight(){
  $$('#lecList .lec.cur').forEach(function(r){ r.classList.remove('cur'); });
  if(!cs||!cs.current) return;
  var r=$('#lecList .lec[data-vid="'+cs.current+'"]'); if(r) r.classList.add('cur');
}
function renderFoot(){
  var s=cs; if(!s) return;
  var f=$('#crFoot');
  if(s.loading && !s.videos.length){ f.innerHTML=skeleton(7); return; }
  if(s.loading){ f.innerHTML='<div class="foot"><span class="spin"></span>Loading more lectures…</div>'; return; }
  if(s.error){
    f.innerHTML='<div class="empty"><b>Couldn’t load lectures</b>'+esc(s.error)+'<div class="acts"><button class="btn" data-act="retry">Try again</button><button class="btn ghost" data-act="plist">Play whole playlist</button><button class="btn ghost" data-act="ext">Open in YouTube</button></div></div>';
    return;
  }
  if(s.done && !s.videos.length){
    f.innerHTML='<div class="empty"><b>No lectures found</b>This playlist is empty or private.<div class="acts"><button class="btn ghost" data-act="ext">Open in YouTube</button></div></div>';
    return;
  }
  f.innerHTML = s.done ? '<div class="foot">That’s every lecture in this course</div>' : '';
}
function loadMore(){
  var s=cs;
  if(!s||s.dead||s.done) return Promise.resolve();
  if(s.inflight) return s.inflight;
  s.loading=true; s.error=null; renderFoot();
  s.inflight=(function(){
    var payload = s.token ? {continuation:s.token} : {browseId:'VL'+s.pl};
    return browse(payload).then(function(j){
      if(s.dead) return;
      var r=parseBrowse(j);
      s.token=r.token; if(r.total!=null) s.total=r.total;
      if(!r.token) s.done=true;
      var fresh=[];
      r.videos.forEach(function(v){
        if(s.seen[v.id]) return;
        s.seen[v.id]=1; s.videos.push(v); fresh.push(v);
        s.meta[v.id]={t:v.t};
      });
      var start=s.videos.length-fresh.length;
      var list=$('#lecList');
      if(list && fresh.length) list.insertAdjacentHTML('beforeend', fresh.map(function(v,i){ return rowHtml(v,start+i+1); }).join(''));
      highlight();
      if(s.current) updateNow();
    }).catch(function(e){
      if(!s.dead) s.error=(e&&e.message)||'Network error';
    }).then(function(){
      s.loading=false; s.inflight=null;
      if(!s.dead){ updateCount(); renderFoot(); maybeMore(); }
    });
  })();
  return s.inflight;
}
function maybeMore(){
  var s=cs; if(!s||s.dead||s.loading||s.done||s.error) return;
  var sc=$('#crScroll');
  if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<700) loadMore();
}
$('#crScroll').addEventListener('scroll',maybeMore,{passive:true});

$('#crBody').addEventListener('click',function(e){
  if(!cs) return;
  var sv=e.target.closest('[data-save]');
  if(sv){ var id=sv.getAttribute('data-save'); toggleSave({id:id,t:titleOf(id),pl:cs.pl}); return; }
  var row=e.target.closest('.lec');
  if(row){ playVideo(row.getAttribute('data-vid')); return; }
  if(e.target.closest('#startBtn') && cs.videos[0]) playVideo(cs.videos[0].id);
});
$('#crFoot').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||!cs) return;
  var a=b.getAttribute('data-act');
  if(a==='retry'){ cs.error=null; loadMore(); }
  else if(a==='plist') playPlaylist();
  else if(a==='ext') openExternal(playlistUrl());
});
$('#nowSave').addEventListener('click',function(){
  if(cs&&cs.current) toggleSave({id:cs.current,t:titleOf(cs.current),pl:cs.pl});
});
$('#nowExt').addEventListener('click',function(){ if(cs) openExternal(videoUrl()); });
$('#playerMsg').addEventListener('click',function(e){
  var b=e.target.closest('[data-pm]'); if(!b||!cs) return;
  if(b.getAttribute('data-pm')==='ext') openExternal(videoUrl()); else playNext();
});

/* ---------- player ---------- */
function showMsg(html){ var m=$('#playerMsg'); m.innerHTML=html; m.classList.remove('hidden'); }
function hideMsg(){ var m=$('#playerMsg'); m.classList.add('hidden'); m.innerHTML=''; }
function updateNow(){
  if(!cs||!cs.current) return;
  var id=cs.current;
  $('#nowTitle').textContent=titleOf(id)||'Lecture';
  var b=$('#nowSave'); b.setAttribute('data-save',id); b.classList.toggle('is',isSaved(id));
}
function loadYT(){
  if(window.YT&&window.YT.Player) return Promise.resolve();
  if(ytP) return ytP;
  ytP=new Promise(function(res,rej){
    var prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=function(){ if(typeof prev==='function') prev(); res(); };
    var s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.async=true;
    s.onerror=function(){ ytP=null; rej(new Error('The video player needs an internet connection.')); };
    document.head.appendChild(s);
  });
  return ytP;
}
function destroyPlayer(){
  try{ if(yt&&yt.destroy) yt.destroy(); }catch(e){}
  yt=null; var h=$('#ytHost'); if(h) h.innerHTML='';
}
function onState(e){
  if(!window.YT||!cs) return;
  if(e.data===YT.PlayerState.PLAYING) hideMsg();
  else if(e.data===YT.PlayerState.ENDED && !cs.playlistMode) playNext();
}
function onErr(e){
  if(!cs) return;
  showMsg('<p>This lecture can’t play inside the app (error '+esc(e&&e.data)+').</p><div class="acts"><button class="btn" data-pm="ext">Open in YouTube</button>'+(cs.playlistMode?'':'<button class="btn ghost" data-pm="next">Next lecture</button>')+'</div>');
}
function playVideo(id){
  var s=cs; if(!s) return Promise.resolve();
  s.current=id; s.playlistMode=false; hideMsg();
  $('#playerBox').classList.remove('hidden'); $('#nowBar').classList.remove('hidden');
  updateNow(); highlight(); updateCount();
  return loadYT().then(function(){
    if(s!==cs||s.dead) return;
    if(yt && yt.loadVideoById && !s.rebuild){ try{ yt.loadVideoById(id); return; }catch(e){} }
    s.rebuild=false;
    destroyPlayer();
    $('#ytHost').innerHTML='<div id="ytPlayer"></div>';
    yt=new YT.Player('ytPlayer',{width:'100%',height:'100%',videoId:id,
      playerVars:{playsinline:1,rel:0,modestbranding:1,autoplay:1,origin:location.origin},
      events:{onReady:function(ev){ try{ ev.target.playVideo(); }catch(_){} },onStateChange:onState,onError:onErr}});
  },function(err){
    if(s===cs) showMsg('<p>'+esc(err.message)+'</p><div class="acts"><button class="btn" data-pm="ext">Open in YouTube</button></div>');
  });
}
function playPlaylist(){
  var s=cs; if(!s) return;
  s.playlistMode=true; s.current=null; s.rebuild=true; hideMsg();
  $('#playerBox').classList.remove('hidden'); $('#nowBar').classList.add('hidden');
  updateCount(); highlight();
  loadYT().then(function(){
    if(s!==cs||s.dead) return;
    destroyPlayer();
    $('#ytHost').innerHTML='<div id="ytPlayer"></div>';
    yt=new YT.Player('ytPlayer',{width:'100%',height:'100%',
      playerVars:{listType:'playlist',list:s.pl,playsinline:1,rel:0,autoplay:1,origin:location.origin},
      events:{onReady:function(ev){ try{ ev.target.playVideo(); }catch(_){} },onError:onErr}});
  },function(err){ if(s===cs) showMsg('<p>'+esc(err.message)+'</p>'); });
}
function playNext(){
  var s=cs; if(!s||s.dead||!s.current) return Promise.resolve();
  var i=s.videos.findIndex(function(v){ return v.id===s.current; });
  if(i<0) return Promise.resolve();
  var ready = (i+1<s.videos.length) ? Promise.resolve() : loadMore();
  return ready.then(function(){
    if(s!==cs||s.dead) return;
    var j=s.videos.findIndex(function(v){ return v.id===s.current; });
    if(j>=0 && j+1<s.videos.length){
      var nx=s.videos[j+1];
      playVideo(nx.id);
      var r=$('#lecList .lec[data-vid="'+nx.id+'"]');
      if(r&&r.scrollIntoView) r.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  });
}

/* ---------- chrome ---------- */
$$('[data-back]').forEach(function(b){ b.addEventListener('click',function(){ back(); }); });
$$('#tabs button').forEach(function(b){
  b.addEventListener('click',function(){ resetTo(b.getAttribute('data-tab')); });
});
$('#homeSub').textContent=COURSES.length+' courses · '+subjects.length+' subjects';
stack.push({name:'home',args:{},scroll:0});
renderTop(false);
})();
</script>
