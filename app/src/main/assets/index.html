<style>
:root{
  --bg:#121A17; --surface:#1B2620; --surface-2:#22302A;
  --ink:#F2F0E8; --ink-muted:#8FA097; --accent:#E8B84B; --accent-ink:#20170A;
  --border:#283730;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:72px;min-height:100vh;}
.serif{font-family:'Source Serif 4',serif;}
button{font-family:inherit;}
.app-shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}

header.topbar{padding:18px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border);}
header.topbar h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:21px;margin:0 0 12px;}
.search-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--ink-muted);}
.search-row svg{flex:none;}
.search-row input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;font-family:'IBM Plex Sans',sans-serif;}
.search-row input::placeholder{color:var(--ink-muted);}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);font-size:13.5px;white-space:nowrap;}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}

#feed{padding:2px 16px 12px;}
.count-row{color:var(--ink-muted);font-size:13px;padding:6px 2px 10px;}

.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.card-thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(160deg,var(--surface-2),var(--surface));display:flex;align-items:center;justify-content:center;color:var(--ink-muted);}
.card-thumb .code-badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink-muted);background:rgba(0,0,0,.3);padding:3px 7px;border-radius:6px;}
.bookmark-btn{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(8,12,10,.55);border:none;color:var(--ink);}
.bookmark-btn svg{width:17px;height:17px;}
.bookmark-btn.active svg path{fill:var(--accent);stroke:var(--accent);}
.card-body{padding:12px 14px 14px;}
.card-title{font-family:'Source Serif 4',serif;font-size:16.5px;font-weight:600;line-height:1.32;margin:0 0 6px;}
.card-meta{font-size:12.5px;color:var(--ink-muted);margin:0;}

.load-more{display:block;width:100%;padding:12px;margin:4px 0 8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;}

.empty-state{padding:60px 24px;text-align:center;color:var(--ink-muted);font-size:14px;line-height:1.5;}
.empty-state .serif{font-size:18px;color:var(--ink);display:block;margin-bottom:6px;}

.watch-view{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;}
.watch-view.hidden{display:none;}
.watch-top{display:flex;align-items:center;padding:12px;position:sticky;top:0;background:var(--bg);z-index:2;max-width:480px;margin:0 auto;}
.back-btn{background:none;border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;width:34px;height:34px;}
.player-wrap{aspect-ratio:16/9;background:#000;width:100%;max-width:480px;margin:0 auto;}
.player-wrap iframe{width:100%;height:100%;border:none;display:block;}
.watch-info{padding:16px;max-width:480px;margin:0 auto;}
.discipline-tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;margin-bottom:10px;}
.watch-info h2{font-family:'Source Serif 4',serif;font-size:21px;font-weight:600;margin:0 0 14px;line-height:1.3;}
.save-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;}
.save-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.save-btn svg path{stroke:currentColor;}
.watch-note{margin-top:18px;font-size:13px;color:var(--ink-muted);line-height:1.55;}

nav.bottomnav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:10;}
nav.bottomnav button{flex:1;background:none;border:none;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;}
nav.bottomnav button.active{color:var(--accent);}
</style>

  "Aerospace Engineering":"AE","Agriculture Engineering":"AGR","Architecture and Planning":"ARCH",

};

async function storageGet(key){
  if (window.storage){
    try{ const r = await window.storage.get(key,false); return r? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key,value){
  if (window.storage){
    try{ await window.storage.set(key,value,false); return; }catch(e){}
  }
  try{ localStorage.setItem(key,value); }catch(e){}
}

let bookmarks = new Set();
let state = { tab:'home', discipline:'All', query:'', visibleCount:24 };
let currentCourseId = null;

const feedEl = document.getElementById('feed');
const savedFeedEl = document.getElementById('savedFeed');
const chipsEl = document.getElementById('chips');
const countRowEl = document.getElementById('countRow');
const homeViewEl = document.getElementById('homeView');
const savedViewEl = document.getElementById('savedView');
const watchViewEl = document.getElementById('watchView');
const searchInput = document.getElementById('searchInput');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function disciplineList(){
  const set = new Set(COURSES.map(c=>c.discipline));
  return ['All', ...Array.from(set).sort()];
}

function renderChips(){
  chipsEl.innerHTML = disciplineList().map(d=>{
    const active = d===state.discipline ? 'active' : '';
    return `<button class="chip ${active}" data-d="${escapeHtml(d)}">${escapeHtml(d)}</button>`;
  }).join('');
  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.discipline = btn.getAttribute('data-d');
      state.visibleCount = 24;
      renderChips();
      renderHome();
    });
  });
}

function filteredCourses(){
  const q = state.query.trim().toLowerCase();
  return COURSES.filter(c=>{
    if (state.discipline!=='All' && c.discipline!==state.discipline) return false;
    if (q && !(c.title.toLowerCase().includes(q) || c.discipline.toLowerCase().includes(q))) return false;
    return true;
  });
}

function cardHtml(c){
  const code = DISC_CODES[c.discipline] || '—';
  const isSaved = bookmarks.has(c.id);
  return `
  <div class="card" data-id="${c.id}">
    <div class="card-thumb">
      <span class="code-badge">${code}</span>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M10 8.5l6 3.5-6 3.5v-7z" fill="currentColor"/></svg>
      <button class="bookmark-btn ${isSaved?'active':''}" data-bookmark="${c.id}" aria-label="Save course">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 4h12v17l-6-4-6 4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="card-body">
      <p class="card-title serif">${escapeHtml(c.title)}</p>
      <p class="card-meta">${escapeHtml(c.discipline)} · NPTEL lecture series</p>
    </div>
  </div>`;
}

function attachCardHandlers(container){
  container.querySelectorAll('.bookmark-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleBookmark(btn.getAttribute('data-bookmark'));
    });
  });
  container.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openWatch(card.getAttribute('data-id')));
  });
}

function renderHome(){
  const list = filteredCourses();
  countRowEl.textContent = `${list.length} course${list.length!==1?'s':''}`;
  if (list.length===0){
    feedEl.innerHTML = `<div class="empty-state"><span class="serif">No courses match</span>Try a different search or category.</div>`;
    return;
  }
  const shown = list.slice(0, state.visibleCount);
  feedEl.innerHTML = shown.map(cardHtml).join('') +
    (list.length>shown.length ? `<button class="load-more" id="loadMoreBtn">Show more</button>` : '');
  attachCardHandlers(feedEl);
  const lm = document.getElementById('loadMoreBtn');
  if (lm) lm.addEventListener('click', ()=>{ state.visibleCount+=24; renderHome(); });
}

function renderSaved(){
  const list = COURSES.filter(c=>bookmarks.has(c.id));
  if (list.length===0){
    savedFeedEl.innerHTML = `<div class="empty-state"><span class="serif">Nothing saved yet</span>Tap the bookmark icon on any course to keep it here.</div>`;
    return;
  }
  savedFeedEl.innerHTML = list.map(cardHtml).join('');
  attachCardHandlers(savedFeedEl);
}

function toggleBookmark(id){
  if (bookmarks.has(id)) bookmarks.delete(id); else bookmarks.add(id);
  storageSet('bookmarks', JSON.stringify(Array.from(bookmarks)));
  if (state.tab==='home') renderHome();
  if (state.tab==='saved') renderSaved();
  if (!watchViewEl.classList.contains('hidden')) updateWatchSaveBtn();
}

function openWatch(id){
  currentCourseId = id;
  const c = COURSES.find(x=>x.id===id);
  if (!c) return;
  document.getElementById('playerWrap').innerHTML =
    `<iframe src="https://www.youtube.com/embed/videoseries?list=${c.playlistId}" title="${escapeHtml(c.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  const isSaved = bookmarks.has(c.id);
  document.getElementById('watchInfo').innerHTML = `
    <span class="discipline-tag">${escapeHtml(c.discipline)}</span>
    <h2 class="serif">${escapeHtml(c.title)}</h2>
    <button class="save-btn ${isSaved?'active':''}" id="watchSaveBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 4h12v17l-6-4-6 4V4z" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span id="watchSaveLabel">${isSaved? 'Saved':'Save'}</span>
    </button>
    <p class="watch-note">Full NPTEL lecture series, played from its official YouTube playlist. Use the playlist panel inside the player to jump between lectures.</p>
  `;
  document.getElementById('watchSaveBtn').addEventListener('click', ()=>toggleBookmark(c.id));
  watchViewEl.classList.remove('hidden');
  window.scrollTo(0,0);
}

function updateWatchSaveBtn(){
  const btn = document.getElementById('watchSaveBtn');
  const label = document.getElementById('watchSaveLabel');
  if (!btn || !currentCourseId) return;
  const isSaved = bookmarks.has(currentCourseId);
  btn.classList.toggle('active', isSaved);
  if (label) label.textContent = isSaved ? 'Saved' : 'Save';
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  document.getElementById('playerWrap').innerHTML = '';
  watchViewEl.classList.add('hidden');
});

document.querySelectorAll('nav.bottomnav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottomnav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    state.tab = tab;
    homeViewEl.style.display = tab==='home' ? 'block':'none';
    savedViewEl.style.display = tab==='saved' ? 'block':'none';
    if (tab==='saved') renderSaved();
  });
});

let searchTimer;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    state.query = searchInput.value;
    state.visibleCount = 24;
    renderHome();
  }, 150);
});

async function init(){
  const raw = await storageGet('bookmarks');
  if (raw){ try{ bookmarks = new Set(JSON.parse(raw)); }catch(e){} }
  renderChips();
  renderHome();
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
init();
</script>
</body>
</html>
